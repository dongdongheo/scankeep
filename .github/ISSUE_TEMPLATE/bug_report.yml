name: Bug report
description: Report a reproducible Scankeep defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include credentials here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest complete sequence that reproduces the defect.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scankeep revision or version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Deployment environment
      description: Include OS, architecture, Docker version, and Compose version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, private URLs, repository names, and other sensitive data.
      render: text
